name: "📖 Documentation"
description: "Fix or complete the OxeePhone documentation (README, brand/ docs, release notes)"
title: "[Docs]: "
labels: [documentation]
body:
  - type: dropdown
    id: type-of-change
    attributes:
      label: "Type of change"
      options:
        - Fix a mistake
        - Update outdated content
        - Add missing content
        - Improve clarity
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: "Page or file"
      placeholder: ".github/README.md · brand/README.md · brand/agent-vm/README.md · release notes v0.9.9"

  - type: textarea
    id: suggested
    attributes:
      label: "What it should say"
      description: "The correction or the missing content, and why."
    validations:
      required: true
