# Routes shared by the HTTP and HTTPS servers (included at server level).

# Docker DNS, re-resolved: the api / ui containers get new addresses
# whenever they are recreated, the proxy must follow without a restart.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;
set $ui_upstream http://ui:3010;
set $minio_upstream http://minio:9000;

client_max_body_size 100M;

# API: REST, SSE, MCP and the WebRTC signaling WebSocket.
location /api/v1/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Oxee-Proxy 1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Recordings, transcripts, uploads (MinIO bucket, anonymous read/write policy).
location /voice-audio/ {
    proxy_pass $minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_buffering off;
}

# Certificate authority of the generated certificate: install it once per
# machine to trust the HTTPS address without warnings.
location = /oxee-ca.crt {
    alias /etc/nginx/oxee-certs/ca.crt;
    default_type application/x-x509-ca-cert;
}

# UI (Next.js), including its own /api/config routes.
location / {
    proxy_pass $ui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}
