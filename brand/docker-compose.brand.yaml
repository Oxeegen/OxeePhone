# OxeePhone overlay on the upstream docker-compose.yaml.
#
#   docker compose -f docker-compose.yaml -f brand/docker-compose.brand.yaml up -d --build
#
# Builds OxeePhone images from this repo (upstream pulls dograhai/* images,
# which do not contain the brand layer) and cuts every Dograh telemetry /
# hosted-service endpoint at the environment level too. The code-level gates
# (api/brand, ui/src/brand) already block them; this is defence in depth.
# Relative paths resolve against the first compose file, i.e. the repo root.
#
# Browsers reach everything through the `proxy` service: UI, /api/v1 (HTTP +
# WebSocket) and /voice-audio on one origin, so the server works under every
# name it has (LAN IP, VPN hostname...). HTTPS (OXEE_HTTPS_PORT, default 3443)
# for every name but localhost, since browsers only allow the microphone in a
# secure context; set OXEE_TLS_NAMES. Port 8000 stays published for webhooks,
# MCP and scripts. See brand/proxy/.
#
# Every published port comes from .env (OXEE_*_PORT), with upstream's value
# as default, and container names derive from the project name: an OxeePhone
# stack can run next to an official Dograh one on the same host (shift the
# ports, see brand/install.sh). OxeePhone runs its own TURN server on
# OXEE_TURN_PORT / OXEE_TURNS_PORT / OXEE_TURN_RELAY_MIN-MAX.

name: oxeephone

services:
  postgres:
    ports: !override
      - "${OXEE_DB_BIND:-0.0.0.0}:${OXEE_POSTGRES_PORT:-5432}:5432"

  redis:
    ports: !override
      - "${OXEE_DB_BIND:-0.0.0.0}:${OXEE_REDIS_PORT:-6379}:6379"

  minio:
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-minio
    ports: !override
      - "127.0.0.1:${OXEE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${OXEE_MINIO_CONSOLE_PORT:-9001}:9001"

  dograh-init:
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-init

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-nginx

  coturn:
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-coturn
    # Same port numbers inside and outside: coturn hands its relay addresses
    # to the peers, a remapped port would not match.
    ports: !override
      - "${OXEE_TURN_PORT:-3478}:${OXEE_TURN_PORT:-3478}/udp"
      - "${OXEE_TURN_PORT:-3478}:${OXEE_TURN_PORT:-3478}/tcp"
      - "${OXEE_TURNS_PORT:-5349}:${OXEE_TURNS_PORT:-5349}/udp"
      - "${OXEE_TURNS_PORT:-5349}:${OXEE_TURNS_PORT:-5349}/tcp"
      - "${OXEE_TURN_RELAY_MIN:-49152}-${OXEE_TURN_RELAY_MAX:-49200}:${OXEE_TURN_RELAY_MIN:-49152}-${OXEE_TURN_RELAY_MAX:-49200}/udp"
    # The rendered turnserver.conf, with the ports overridden on the command line.
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --listening-port=${OXEE_TURN_PORT:-3478}
      - --tls-listening-port=${OXEE_TURNS_PORT:-5349}
      - --min-port=${OXEE_TURN_RELAY_MIN:-49152}
      - --max-port=${OXEE_TURN_RELAY_MAX:-49200}

  cloudflared:
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-cloudflared
    ports: !override
      - "${OXEE_TUNNEL_METRICS_PORT:-2000}:2000"

  api:
    image: ${OXEE_REGISTRY:-oxeegen}/oxeephone-api:${OXEE_TAG:-latest}
    # Direct API (telephony webhooks, MCP, scripts); browsers use the proxy.
    ports: !override
      - "${OXEE_API_PORT:-8000}:8000"
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      OXEE_DISABLE_DOGRAH_SERVICES: "true"
      OXEE_DISABLE_TELEMETRY: "true"
      OXEE_LOCAL_MODELS_ONLY: "true"
      OXEE_SAME_ORIGIN: "true"
      # TURN URIs handed to browsers and to the API's own peer.
      TURN_PORT: "${OXEE_TURN_PORT:-3478}"
      TURN_TLS_PORT: "${OXEE_TURNS_PORT:-5349}"
      # Docker Desktop / no hairpin: the API reaches coturn on the Docker
      # network ("coturn"); browsers keep TURN_HOST (see api/brand/webrtc.py).
      OXEE_SERVER_TURN_HOST: "${OXEE_SERVER_TURN_HOST:-}"
      ENABLE_TELEMETRY: "false"
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      SENTRY_DSN: ""
      # Unroutable on purpose: nothing may reach services.dograh.com.
      MPS_API_URL: "http://mps.disabled.invalid"

  ui:
    image: ${OXEE_REGISTRY:-oxeegen}/oxeephone-ui:${OXEE_TAG:-latest}
    # Served by `proxy` on the same port, never directly.
    ports: !reset []
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      ENABLE_TELEMETRY: "false"
      POSTHOG_KEY: ""
      POSTHOG_HOST: ""
      SENTRY_DSN: ""

  proxy:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-oxeephone}-proxy
    restart: unless-stopped
    depends_on:
      - ui
      - api
    ports:
      - "${OXEE_UI_PORT:-3010}:80"
      - "${OXEE_HTTPS_PORT:-3443}:443"
    environment:
      # Every name browsers use to reach the server, for the certificate
      # (comma-separated), e.g. "10.100.21.41,sngi-ai-phone-01.nb.us".
      OXEE_TLS_NAMES: "${OXEE_TLS_NAMES:-}"
      # true: your own server.crt / server.key in the oxeephone-certs volume.
      OXEE_TLS_CUSTOM: "${OXEE_TLS_CUSTOM:-false}"
      OXEE_HTTPS_PORT: "${OXEE_HTTPS_PORT:-3443}"
      # Plain HTTP on another name than localhost goes to HTTPS (microphone).
      OXEE_HTTPS_REDIRECT: "${OXEE_HTTPS_REDIRECT:-true}"
      NGINX_ENVSUBST_FILTER: "^OXEE_"
    volumes:
      - ./brand/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./brand/proxy/locations.conf:/etc/nginx/oxee/locations.conf:ro
      - ./brand/proxy/cert.sh:/docker-entrypoint.d/05-oxee-cert.sh:ro
      - oxeephone-certs:/etc/nginx/oxee-certs
    networks:
      - app-network

volumes:
  oxeephone-certs:
